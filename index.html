<!doctype html>
<html lang="uk" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Додаток для збору даних про торгові точки та формування паспортів регіонів." />
    <meta property="og:title" content="Паспорт регіону" />
    <meta property="og:description" content="Додаток для збору даних про торгові точки та формування паспортів регіонів." />
    <title>Паспорт регіону</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('crm_theme') || 'dark';
          document.documentElement.classList.add(t);
          if (t === 'light') document.documentElement.classList.remove('dark');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
